<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbyxBot · Kick</title><style>body{margin:0;min-height:100vh;background:#09100b;color:#f0fff2;font:16px system-ui;display:grid;place-items:center}.box{width:min(560px,90vw);padding:32px;border:1px solid #355b3d;border-radius:18px;background:#101c13;box-shadow:0 20px 80px #000}.mark{color:#53fc18;font-weight:900;letter-spacing:.12em}.pill{float:right;color:#9db3a1;font-size:.8rem}h1{margin:.4rem 0}p{color:#b7c8ba}form{display:flex;gap:8px;margin:24px 0}input,button{padding:13px;border-radius:8px;font:inherit}input{flex:1;background:#071009;border:1px solid #426948;color:white}button{border:0;background:#53fc18;color:#061006;font-weight:800;cursor:pointer}.off{background:#26362a;color:#e1f4e4}#messages{height:180px;overflow:auto;padding:12px;background:#071009;border-radius:10px;font-size:.9rem}.msg{padding:5px 0;border-bottom:1px solid #193020}.name{color:#53fc18;font-weight:700}</style><main class="box"><span class="mark">ORBYXBOT</span><span class="pill">SÓLO KICK</span><h1>Chat de Kick</h1><p id="status">Cargando estado…</p><form id="form"><input id="channel" placeholder="tu_canal_de_kick" autocomplete="off"><button>Conectar</button><button type="button" id="disconnect" class="off">Desconectar</button></form><div id="messages">Los mensajes en vivo aparecerán aquí.</div></main><script>const status=document.querySelector('#status'),out=document.querySelector('#messages'),input=document.querySelector('#channel');const show=x=>status.textContent=x;fetch('/api/status').then(r=>r.json()).then(s=>{show(s.message);input.value=s.channel||''});document.querySelector('#form').onsubmit=async e=>{e.preventDefault();show('Conectando…');const r=await fetch('/api/kick/connect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({channel:input.value})});const x=await r.json();show(x.message||`Conectado a @${x.channel}`)};document.querySelector('#disconnect').onclick=async()=>{await fetch('/api/kick/disconnect',{method:'POST'});show('Desconectado.')};const ws=new WebSocket(`ws://${location.host}`);ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.event==='status')show(x.data.message);if(x.event==='chat'){const row=document.createElement('div');row.className='msg';row.innerHTML=`<span class="name">${x.data.sender}</span>: ${x.data.message}`;out.append(row);out.scrollTop=out.scrollHeight}}</script></html>
