<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>OBS Now Playing Song Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Chakra+Petch:wght@400;700&family=Cinzel:wght@700&family=Creepster&family=Fredoka:wght@500;700&family=Inter:wght@400;700&family=Luckiest+Guy&family=Montserrat:wght@500;700;900&family=Orbitron:wght@600;900&family=Outfit:wght@400;600;800&family=Permanent+Marker&family=Poppins:wght@400;600;800&family=Press+Start+2P&family=Righteous&family=Roboto:wght@400;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/overlays.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
  <div class="np-container">
    <div id="npCard" class="np-card">
      <div class="np-thumb-wrapper">
        <img id="npThumb" class="np-thumb" src="" alt="Album Cover">
      </div>
      <div class="np-info">
        <div class="np-tag">
          <span>NOW PLAYING</span>
          <div class="np-equalizer">
            <div class="np-bar"></div>
            <div class="np-bar"></div>
            <div class="np-bar"></div>
            <div class="np-bar"></div>
          </div>
        </div>
        <div id="npTitle" class="np-title">Esperando canciones...</div>
        <div id="npRequester" class="np-requester">Pedida por <strong>Streamer</strong></div>
      </div>
    </div>
  </div>

  <!-- Reproductor visible para OBS / Chromium pero sutil en pantalla -->
  <div id="obsYtContainer" style="position: absolute; bottom: 0; right: 0; width: 200px; height: 200px; opacity: 0.95; z-index: -1; pointer-events: none; overflow: hidden;">
    <div id="obsYtPlayer"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Load custom widget styles from streamer config
    (async function loadCustomStyles() {
      try {
        const res = await fetch('/api/widget-styles');
        const data = await res.json();
        if (data.nowplaying) {
          if (data.nowplaying.finalCSS || data.nowplaying.generatedCSS) {
            const style = document.createElement('style');
            style.id = 'orbibot-custom-styles';
            style.textContent = data.nowplaying.finalCSS || data.nowplaying.generatedCSS;
            document.head.appendChild(style);
          }
          if (data.nowplaying.customJS) {
            const script = document.createElement('script');
            script.textContent = data.nowplaying.customJS;
            document.body.appendChild(script);
          }
        }
      } catch(e) { /* Overlay running without backend */ }
    })();

    const npCard = document.getElementById('npCard');
    const npThumb = document.getElementById('npThumb');
    const npTitle = document.getElementById('npTitle');
    const npRequester = document.getElementById('npRequester');

    const urlParams = new URLSearchParams(window.location.search);
    // El audio ahora se emite con el widget dedicado music_player.html para tener control de volumen independiente en OBS.
    // En nowplaying.html solo se activará si se pasa explícitamente ?audio=1.
    const enableAudio = urlParams.get('audio') === '1';

    let ytPlayer = null;
    let ytApiReady = false;
    let pendingVideoId = null;
    let audioCtx = null;

    function unlockAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          try { audioCtx = new AudioContextClass(); } catch(e) {}
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(evt => {
      window.addEventListener(evt, () => {
        unlockAudio();
      }, { passive: true });
    });

    window.onYouTubeIframeAPIReady = function() {
      if (!enableAudio) return;
      unlockAudio();
      const validOrigin = (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file')) ? window.location.origin : 'https://www.youtube.com';
      ytPlayer = new YT.Player('obsYtPlayer', {
        height: '200',
        width: '200',
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0,
          playsinline: 1,
          enablejsapi: 1,
          iv_load_policy: 3,
          origin: validOrigin,
          widget_referrer: window.location.href
        },
        events: {
          onReady: (event) => {
            ytApiReady = true;
            try {
              event.target.unMute();
              event.target.setVolume(100);
            } catch(e) {}
            if (pendingVideoId) {
              playYouTubeVideo(pendingVideoId);
              pendingVideoId = null;
            }
          },
          onStateChange: (event) => {
            if (event.data === 1 || event.data === 3) {
              try {
                event.target.unMute();
                event.target.setVolume(100);
              } catch(e) {}
            }
            // Solo notificar fin si el audio está activo en este widget y realmente se reprodujo
            if (enableAudio && event.data === 0) {
              const curTime = (event.target && event.target.getCurrentTime) ? event.target.getCurrentTime() : 0;
              if (curTime > 5) {
                fetch('/api/sr/skip', { method: 'POST' }).catch(() => {});
              }
            }
          },
          onError: (event) => {
            console.warn('YouTube OBS Player error:', event.data);
            // Solo saltar si el audio está activo y es un error irrecuperable (100, 101, 150)
            if (enableAudio && (event.data === 100 || event.data === 101 || event.data === 150)) {
              setTimeout(() => {
                fetch('/api/sr/skip', { method: 'POST' }).catch(() => {});
              }, 3000);
            }
          }
        }
      });
    };

    function playYouTubeVideo(videoId) {
      if (!enableAudio || !videoId) return;
      unlockAudio();
      if (ytPlayer && ytApiReady && ytPlayer.loadVideoById) {
        try {
          ytPlayer.loadVideoById({
            videoId: videoId,
            startSeconds: 0,
            suggestedQuality: 'small'
          });
          if (ytPlayer.unMute) ytPlayer.unMute();
          if (ytPlayer.setVolume) ytPlayer.setVolume(100);
          ytPlayer.playVideo();
        } catch(e) {}
      } else {
        pendingVideoId = videoId;
      }
    }

    function stopYouTubeVideo() {
      pendingVideoId = null;
      if (ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch(e) {}
      }
    }

    function updateSong(song) {
      if (!song) {
        npCard.classList.remove('visible');
        stopYouTubeVideo();
        return;
      }

      npThumb.src = song.thumbnail || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80';
      npTitle.innerText = song.title || 'Canción desconocida';
      npRequester.innerHTML = `Pedida por <strong>@${song.requester || 'Anónimo'}</strong>`;
      npCard.classList.add('visible');

      if (song.videoId) {
        playYouTubeVideo(song.videoId);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const channel = (urlParams.get('channel') || urlParams.get('kick') || urlParams.get('streamer') || '').toLowerCase().replace(/^#/, '').replace(/^@/, '');
    const token = (urlParams.get('token') || urlParams.get('key') || '').trim();
    const songStorageKey = channel ? ('orbibot_current_song_' + channel) : 'orbibot_current_song';

    // Initial check from localStorage or API
    try {
      const saved = localStorage.getItem(songStorageKey);
      if (saved) updateSong(JSON.parse(saved));
    } catch(e) {}

    const stateUrl = channel ? `/api/sr/state?channel=${encodeURIComponent(channel)}` : '/api/sr/state';
    fetch(stateUrl)
      .then(r => r.json())
      .then(state => {
        if (state.currentSong && state.isPlaying) {
          updateSong(state.currentSong);
        }
      })
      .catch(() => {});

    const myStreamerKey = channel || '';
    const myToken = token || '';
    const linkedChannels = new Set([myStreamerKey]);

    fetch('/api/config')
      .then(r => r.json())
      .then(cfg => {
        if (cfg?.twitch?.channel) linkedChannels.add(cfg.twitch.channel.toLowerCase().replace(/^#/, ''));
        if (cfg?.kick?.channel || cfg?.kick?.username) linkedChannels.add((cfg.kick.channel || cfg.kick.username).toLowerCase().replace(/^@/, ''));
      })
      .catch(() => {});

    function handleIncomingMessage(msg) {
      if (!msg) return;

      // Validación estricta de aislamiento: descartar eventos de otros streamers
      if (myStreamerKey || myToken) {
        const targetRoom = (msg.room || msg.channel || msg.data?.channel || msg.data?.room || '').toLowerCase().replace(/^#/, '').replace(/^@/, '').trim();
        const targetToken = (msg.token || msg.data?.token || '').trim();

        if (myStreamerKey) {
          if (targetRoom && targetRoom !== 'default' && targetRoom !== myStreamerKey && targetRoom !== myToken && !linkedChannels.has(targetRoom)) {
            return;
          }
          if (targetRoom === 'default' && myStreamerKey !== 'default') {
            return;
          }
        }
        if (myToken && targetToken && targetToken !== myToken) {
          return;
        }
      } else {
        return;
      }

      if (msg.event === 'init_state' && msg.data?.srState?.currentSong) {
        updateSong(msg.data.srState.currentSong);
      } else if (msg.event === 'sr_update') {
        const update = msg.data;
        if (update.action === 'play') {
          updateSong(update.data);
        } else if (update.action === 'skip') {
          updateSong(update.data?.current);
        } else if (update.action === 'stop') {
          updateSong(null);
        } else if (update.action === 'pause') {
          stopYouTubeVideo();
        } else if (update.action === 'resume' && update.data?.current) {
          updateSong(update.data.current);
        }
      } else if (msg.event === 'sr_play' || msg.event === 'sr_resume') {
        if (msg.data?.videoId || msg.data?.current?.videoId) {
          updateSong(msg.data.current || msg.data);
        }
      } else if (msg.event === 'sr_pause') {
        stopYouTubeVideo();
      }
    }

    function connectChannels() {
      // 1. Local WebSocket con reconexión automática en segundo plano
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          wsInstance = new WebSocket(url);
          wsInstance.onopen = () => {
            if (channel) {
              wsInstance.send(JSON.stringify({ action: 'join', channel, room: channel }));
            }
          };
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
          wsInstance.onerror = () => scheduleWsReconnect(url);
          wsInstance.onclose = () => scheduleWsReconnect(url);
        } catch(e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}${channel ? '?channel=' + encodeURIComponent(channel) : ''}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // 2. Cloud Real-time Relay (Paho MQTT) con reconexión automática
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho !== 'undefined') {
          if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

          if (!channel) return;
          const clientId = 'orbi_np_' + Math.random().toString(36).substring(2, 9);
          try {
            mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
            mqttClient.onConnectionLost = (responseObject) => {
              console.warn('MQTT Connection lost, reconnecting in 3.5s...', responseObject);
              scheduleMqttReconnect();
            };
            mqttClient.onMessageArrived = (message) => {
              try {
                const payload = JSON.parse(message.payloadString);
                handleIncomingMessage(payload);
              } catch(e) {}
            };
            mqttClient.connect({
              useSSL: true,
              timeout: 6,
              keepAliveInterval: 30,
              onSuccess: () => {
                if (token) {
                  mqttClient.subscribe(`orbibot/${channel}_${token}/events`);
                } else {
                  mqttClient.subscribe(`orbibot/${channel}/events`);
                }
              },
              onFailure: (e) => {
                console.warn('MQTT connect failed, retrying in 4s...', e);
                scheduleMqttReconnect();
              }
            });
          } catch(e) {
            scheduleMqttReconnect();
          }
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      // 3. BroadcastChannel con aislamiento estricto por streamer
      if (typeof BroadcastChannel !== 'undefined' && (myStreamerKey || myToken)) {
        const chanName = myStreamerKey || myToken;
        try {
          const scopedBc = new BroadcastChannel('orbyxbot_stream_' + chanName);
          scopedBc.onmessage = (e) => handleIncomingMessage(e.data);
        } catch(e) {}
      }

      window.addEventListener('storage', (e) => {
        if (myStreamerKey && e.key === ('orbibot_last_event_' + myStreamerKey) && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
        if (myToken && e.key === ('orbibot_last_event_' + myToken) && e.newValue) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });

      // 4. OBS Scene Activate & Visibility Health Watcher
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (!wsInstance || wsInstance.readyState !== WebSocket.OPEN) {
            connectLocalWs(wsUrl);
          }
          if (!mqttClient || !mqttClient.isConnected()) {
            connectMqtt();
          }
        }
      });

      // 5. Chequeo periódico de salud en segundo plano cada 15s
      setInterval(() => {
        const wsOpen = wsInstance && wsInstance.readyState === WebSocket.OPEN;
        const mqttOpen = mqttClient && mqttClient.isConnected();
        if (!wsOpen && !mqttOpen) {
          connectLocalWs(wsUrl);
          connectMqtt();
        }
      }, 15000);
    }

    connectChannels();
  </script>
</body>
</html>
