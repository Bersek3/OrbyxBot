  <style>
    .tts-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(14, 18, 28, 0.9);
      border: 1px solid var(--primary-purple);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .tts-indicator.active {
      opacity: 1;
    }
    .tts-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 14px;
    }
    .tts-wave-bar {
      width: 3px;
      height: 100%;
      background: var(--neon-cyan);
      border-radius: 2px;
      animation: eqBounce 0.8s infinite ease-in-out;
    }
    .audio-unlock-banner {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.95), rgba(219, 39, 119, 0.95));
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      cursor: pointer;
      z-index: 99999;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.35);
      user-select: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .audio-unlock-banner:hover {
      transform: translateX(-50%) scale(1.04);
    }
  </style>
</head>

    function unlockAudio() {
      userHasInteracted = true;
      const banner = document.getElementById('audioUnlockBanner');
      if (banner) banner.style.display = 'none';

      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          try { audioCtx = new AudioContextClass(); } catch(e) {}
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.resume(); } catch(e) {}
      }
      if (typeof pendingAutoplayRetry === 'function') {
        const retryFn = pendingAutoplayRetry;
        pendingAutoplayRetry = null;
        retryFn();
      }
    }

    // Escuchar interacción del usuario para habilitar audio en navegadores estándar
    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(evt => {
      window.addEventListener(evt, unlockAudio, { passive: true });
    });

    function showAudioUnlockPrompt(retryFn) {
      if (userHasInteracted) return;
      pendingAutoplayRetry = retryFn;
      const banner = document.getElementById('audioUnlockBanner');
      if (banner) {
        banner.style.display = 'flex';
      }
    }

    /**
     * Detiene de inmediato cualquier reproducción de audio o síntesis activa
     */
    function stopCurrentAudio() {
      if (currentSegmentTimer) {
        clearTimeout(currentSegmentTimer);
        currentSegmentTimer = null;
      }
      if (currentFinalizeTimer) {
        clearTimeout(currentFinalizeTimer);
        currentFinalizeTimer = null;
      }
      if (currentActiveAudio) {
        try {
          currentActiveAudio.onended = null;
          currentActiveAudio.onerror = null;
          currentActiveAudio.pause();
          currentActiveAudio.currentTime = 0;
          currentActiveAudio.src = '';
        } catch (e) {}
        currentActiveAudio = null;
      }
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
    }

    /**
     * Reproduce audio vía StreamElements TTS / Google TTS / Web Speech API garantizando invocación única de callback onEnd
     */
    function playTTSAudio(text, voiceKey, volume = 0.9, onEnd = null) {
      stopCurrentAudio();

      const cleanKey = (voiceKey || '').toString().toLowerCase().trim().replace(/^[-@/]/, '').replace(/^voice:/, '');
      const profile = VOICE_PROFILES[cleanKey] || VOICE_PROFILES[voiceKey] || VOICE_PROFILES['es_mx_mia'];
      const targetLang = (profile.lang || 'es-ES').split('-')[0].toLowerCase();

      const seVoiceMap = {
        es_mx_mia: 'Mia', mia: 'Mia',
        es_us_miguel: 'Miguel', miguel: 'Miguel',
        es_us_penelope: 'Penelope', penelope: 'Penelope',
        es_es_enrique: 'Enrique', enrique: 'Enrique',
        es_es_conchita: 'Conchita', conchita: 'Conchita',
        es_es_lucia: 'Lucia', lucia: 'Lucia',
        en_brian: 'Brian', brian: 'Brian',
        en_emma: 'Emma', emma: 'Emma',
        en_joey: 'Joey', joey: 'Joey',
        en_matthew: 'Matthew', matthew: 'Matthew',
        en_kendra: 'Kendra', kendra: 'Kendra',
        en_justin: 'Justin', justin: 'Justin',
        en_russell: 'Russell', russell: 'Russell',
        pt_cristiano: 'Cristiano', cristiano: 'Cristiano',
        fr_mathieu: 'Mathieu', mathieu: 'Mathieu',
        it_giorgio: 'Giorgio', giorgio: 'Giorgio',
        de_hans: 'Hans', hans: 'Hans',
        ja_takumi: 'Takumi', takumi: 'Takumi',
        ja_mizuki: 'Mizuki', mizuki: 'Mizuki'
      };

      let audioUrl = '';
      const seVoice = seVoiceMap[cleanKey];
      if (seVoice) {
        audioUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${encodeURIComponent(seVoice)}&text=${encodeURIComponent(text)}`;
      } else {
        audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${encodeURIComponent(targetLang || 'es')}&client=tw-ob`;
      }

      const audio = new Audio();
      audio.crossOrigin = 'anonymous';
      audio.src = audioUrl;
      audio.volume = Math.max(0, Math.min(1, volume));
      currentActiveAudio = audio;

      let isFinished = false;
      function done() {
        if (isFinished) return;
        isFinished = true;
        if (currentActiveAudio === audio) {
          currentActiveAudio = null;
        }
        if (typeof onEnd === 'function') onEnd();
      }

      audio.onended = done;
      audio.onerror = () => {
        fallbackSpeechSynth();
      };

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          userHasInteracted = true;
          const banner = document.getElementById('audioUnlockBanner');
          if (banner) banner.style.display = 'none';
        }).catch((err) => {
          if (err && err.name === 'NotAllowedError') {
            console.warn('[TTS Overlay] Autoplay bloqueado por el navegador. Requiere interacción del usuario en la pestaña.');
            showAudioUnlockPrompt(() => {
              audio.play().catch(() => fallbackSpeechSynth());
            });
          } else {
            fallbackSpeechSynth();
          }
        });
      }

      function fallbackSpeechSynth() {
        if (!('speechSynthesis' in window)) {
          done();
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.volume = Math.max(0, Math.min(1, volume));
          utterance.rate = profile.rate || 1.0;
          utterance.pitch = profile.pitch || 1.0;
          utterance.lang = profile.lang || 'es-ES';

          const voices = window.speechSynthesis.getVoices() || [];
          let matchedVoice = voices.find(v => v.lang.toLowerCase().startsWith(targetLang));
          if (!matchedVoice) matchedVoice = voices.find(v => v.lang.toLowerCase().startsWith('es') || v.lang.toLowerCase().startsWith('en'));
          if (matchedVoice) utterance.voice = matchedVoice;

          utterance.onend = done;
          utterance.onerror = done;
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          done();
        }
      }
    }

    /**
     * Procesa la cola de mensajes TTS en orden secuencial estricto (1 mensaje a la vez)
     */
    function processQueue() {
      if (isSpeaking || queue.length === 0) return;
      isSpeaking = true;

      const item = queue.shift();
      ttsIndicator.classList.add('active');
      ttsUser.innerText = `TTS: ${item.user || 'Espectador'}`;

      const rawSegments = Array.isArray(item.segments) && item.segments.length > 0
        ? item.segments
        : [{
            voice: item.voice || 'es_mx_mia',
            voiceName: item.voiceName || (VOICE_PROFILES[item.voice]?.name || item.voice || 'Voz'),
            text: item.text || '',
            audioUrl: item.audioUrl,
            engine: item.engine
          }];

      let currentSegIdx = 0;
      let itemFinalized = false;

      function finalizeItem() {
        if (itemFinalized) return;
        itemFinalized = true;

        stopCurrentAudio();
        ttsIndicator.classList.remove('active');

        // Pausa de 350ms antes de avanzar al siguiente mensaje de la cola
        if (currentFinalizeTimer) clearTimeout(currentFinalizeTimer);
        currentFinalizeTimer = setTimeout(() => {
          isSpeaking = false;
          processQueue();
        }, 350);
      }

      function playNextSegment() {
        if (itemFinalized) return;
        if (currentSegIdx >= rawSegments.length) {
          finalizeItem();
          return;
        }

        const seg = rawSegments[currentSegIdx++];
        const segVoiceName = seg.voiceName || (VOICE_PROFILES[seg.voice]?.name || seg.voice || 'TTS');
        ttsUser.innerText = `${item.user || 'Espectador'} (${segVoiceName})`;

        // Temporizador de seguridad dinámico basado en la longitud del texto (mínimo 15 segundos)
        const segTextLen = (seg.text || '').length;
        const dynamicTimeoutMs = Math.max(15000, segTextLen * 350);

        if (currentSegmentTimer) clearTimeout(currentSegmentTimer);
        currentSegmentTimer = setTimeout(() => {
          console.warn(`[TTS Overlay] Timeout de seguridad para segmento alcanzado (${dynamicTimeoutMs}ms). Avanzando...`);
          stopCurrentAudio();
          playNextSegment();
        }, dynamicTimeoutMs);

        let segmentDone = false;
        const handleSegmentEnd = () => {
          if (segmentDone) return;
          segmentDone = true;
          if (currentSegmentTimer) {
            clearTimeout(currentSegmentTimer);
            currentSegmentTimer = null;
          }
          playNextSegment();
        };

        const segAudioUrl = seg.audioUrl || `/api/tts/audio?text=${encodeURIComponent(seg.text)}&voice=${encodeURIComponent(seg.voice || 'es_mx_mia')}`;
        const isFish = seg.engine === 'fish_audio' || fishAudioKeys.includes(seg.voice) || (segAudioUrl && segAudioUrl.includes('/api/tts/audio'));

        if (isFish && segAudioUrl) {
          stopCurrentAudio();
          const directAudio = new Audio();
          directAudio.crossOrigin = 'anonymous';
          directAudio.src = segAudioUrl;
          directAudio.volume = item.volume !== undefined ? item.volume : 0.9;
          currentActiveAudio = directAudio;

          directAudio.onended = () => {
            if (currentActiveAudio === directAudio) currentActiveAudio = null;
            handleSegmentEnd();
          };

          let fallbackInvoked = false;
          const runFallback = () => {
            if (fallbackInvoked || segmentDone || itemFinalized) return;
            fallbackInvoked = true;
            if (currentActiveAudio === directAudio) currentActiveAudio = null;
            playTTSAudio(seg.text, seg.voice, item.volume !== undefined ? item.volume : 0.9, handleSegmentEnd);
          };

          directAudio.onerror = (e) => {
            console.warn('[TTS Overlay] Falló audio directo de Fish Audio, usando sintetizador fallback:', e);
            runFallback();
          };

          const playPromise = directAudio.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              userHasInteracted = true;
              const banner = document.getElementById('audioUnlockBanner');
              if (banner) banner.style.display = 'none';
            }).catch((err) => {
              if (err && err.name === 'NotAllowedError') {
                console.warn('[TTS Overlay] Autoplay bloqueado por el navegador en audio directo.');
                showAudioUnlockPrompt(() => {
                  directAudio.play().catch(() => runFallback());
                });
              } else {
                runFallback();
              }
            });
          }
        } else {
          playTTSAudio(seg.text, seg.voice, item.volume !== undefined ? item.volume : 0.9, handleSegmentEnd);
        }
      }

      playNextSegment();
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Deduplicación robusta de eventos TTS para prevenir que se añadan dos veces a la cola
    const recentTtsMap = new Map();
    function isDuplicateTts(msg) {
      if (!msg) return true;
      const data = msg.data || msg;
      const user = (data.user || msg.user || '').trim().toLowerCase();
      const text = (data.text || msg.text || '').trim().toLowerCase();
      const rawId = msg.id || data.id || '';
      const now = Date.now();

      // Limpiar entradas antiguas mayores a 12 segundos
      for (const [key, ts] of recentTtsMap.entries()) {
        if (now - ts > 12000) recentTtsMap.delete(key);
      }

      if (rawId && recentTtsMap.has('id_' + rawId)) {
        return true;
      }

      // Normalizar texto eliminando cualquier comando inicial (!messi, !homero, etc.) y signos para detectar duplicados
      const normalizedText = text
        .replace(/^[!/][a-zA-Z0-9_-]+\s+/, '')
        .replace(/[^\p{L}\p{N}\s]/gu, '')
        .replace(/\s+/g, ' ')
        .trim();

      const contentKey = 'content_' + user + '_' + (normalizedText || text);
      if (user && (normalizedText || text) && recentTtsMap.has(contentKey)) {
        return true;
      }

      if (rawId) recentTtsMap.set('id_' + rawId, now);
      if (user && (normalizedText || text)) recentTtsMap.set(contentKey, now);

      return false;
    }

    let ttsEnabled = true;
    try {
      const localCfg = localStorage.getItem('orbibot_config');
      if (localCfg) {
        const parsed = JSON.parse(localCfg);
        if (parsed.tts && parsed.tts.enabled !== undefined) {
          ttsEnabled = parsed.tts.enabled !== false;
        }
      }
    } catch(e) {}

    const urlParams = new URLSearchParams(window.location.search);
    const channel = (urlParams.get('channel') || urlParams.get('kick') || urlParams.get('streamer') || '').toLowerCase().replace(/^#/, '').replace(/^@/, '').trim();
    const token = (urlParams.get('token') || urlParams.get('key') || '').trim();
    const myStreamerKey = channel || '';
    const myToken = token || '';
    const linkedChannels = new Set([myStreamerKey]);

    fetch('/api/config')
      .then(r => r.json())
      .then(cfg => {
        if (cfg?.tts && cfg.tts.enabled !== undefined) {
          ttsEnabled = cfg.tts.enabled !== false;
        }
        if (cfg?.twitch?.channel) linkedChannels.add(cfg.twitch.channel.toLowerCase().replace(/^#/, ''));
        if (cfg?.kick?.channel || cfg?.kick?.username) linkedChannels.add((cfg.kick.channel || cfg.kick.username).toLowerCase().replace(/^@/, ''));
      })
      .catch(() => {});

    function handleIncomingMessage(msg) {
      if (!msg) return;

      // Room / Channel Verification: descartar TTS de otros canales solo si es claramente de otra cuenta
      if (myStreamerKey || myToken) {
        const targetRoom = (msg.room || msg.channel || msg.data?.channel || msg.data?.room || '').toLowerCase().replace(/^#/, '').replace(/^@/, '').trim();
        const targetToken = (msg.token || msg.data?.token || '').trim();

        if (myToken && targetToken && myToken === targetToken) {
          // Coincidencia exacta de token (máxima prioridad)
        } else if (myStreamerKey && (targetRoom === myStreamerKey || targetRoom === myToken || linkedChannels.has(targetRoom) || targetRoom === 'streamer' || targetRoom === 'default')) {
          // Coincidencia de sala o streamer
        } else if (myToken && !targetToken && (targetRoom === myStreamerKey || linkedChannels.has(targetRoom))) {
          // Transmisión local sin token pero mismo canal
        } else if (targetRoom && targetRoom !== 'default' && targetRoom !== 'streamer' && myStreamerKey && targetRoom !== myStreamerKey && !linkedChannels.has(targetRoom)) {
          return;
        }
      }

      if (msg.event === 'tts') {
        if (!ttsEnabled) {
          console.log('[TTS Overlay] TTS está deshabilitado en la configuración. Mensaje ignorado.');
          return;
        }
        if (isDuplicateTts(msg)) {
          return;
        }
        const ttsItem = msg.data || msg;
        queue.push(ttsItem);
        processQueue();
      } else if (msg.event === 'tts_control') {
        const action = msg.data?.action || msg.action;
        console.log('[TTS Overlay] Comando de control recibido:', action);
        if (action === 'stop') {
          stopCurrentAudio();
          ttsIndicator.classList.remove('active');
          isSpeaking = false;
        } else if (action === 'skip') {
          stopCurrentAudio();
          ttsIndicator.classList.remove('active');
          isSpeaking = false;
          setTimeout(() => processQueue(), 200);
        } else if (action === 'reset' || action === 'clear') {
          stopCurrentAudio();
          queue.length = 0;
          ttsIndicator.classList.remove('active');
          isSpeaking = false;
        } else if (action === 'item_removed') {
          const remId = msg.data?.id || msg.id;
          if (remId) {
            const idx = queue.findIndex(i => i.id === remId);
            if (idx >= 0) queue.splice(idx, 1);
          }
        }
      } else if (msg.event === 'config_updated' || msg.event === 'init_state') {
        const cfg = msg.data?.config || msg.data;
        if (cfg?.tts && cfg.tts.enabled !== undefined) {
          ttsEnabled = cfg.tts.enabled !== false;
        }
      }
    }

    const TTS_ALIAS_MAP = {
      messi: 'es_ar_messi', lionel_messi: 'es_ar_messi', leo_messi: 'es_ar_messi',
      maduro: 'es_ve_maduro', nicolas_maduro: 'es_ve_maduro',
      tiktok: 'es_tiktok', voz_tiktok: 'es_tiktok',
      homero: 'es_mx_homero', homero_simpson: 'es_mx_homero', homer: 'es_mx_homero',
      dross: 'es_dross', drossrotzank: 'es_dross',
      badbunny: 'es_badbunny', bad_bunny: 'es_badbunny', benito: 'es_badbunny',
      rubius: 'es_rubius', elrubius: 'es_rubius', el_rubius: 'es_rubius',
      farid: 'es_farid', farid_dieck: 'es_farid',
      westcol: 'es_westcol',
      cr7: 'es_cr7', cristiano: 'es_cr7', cristiano_ronaldo: 'es_cr7', ronaldo: 'es_cr7', bicho: 'es_cr7', siuuu: 'es_cr7',
      goku: 'es_goku', goku_latino: 'es_goku',
      maradona: 'es_maradona', diego_maradona: 'es_maradona',
      xokas: 'es_xokas', elxokas: 'es_xokas', el_xokas: 'es_xokas',
      illojuan: 'es_illojuan', illo_juan: 'es_illojuan', juan: 'es_illojuan',
      auron: 'es_auronplay', auronplay: 'es_auronplay',
      peruano: 'es_peruano',
      closs: 'es_marianocloss', marianocloss: 'es_marianocloss', mariano_closs: 'es_marianocloss',
      lacobra: 'es_lacobra', la_cobra: 'es_lacobra', cobra: 'es_lacobra',
      davo: 'es_davo', davoxeneize: 'es_davo', davo_xeneize: 'es_davo',
      mia: 'es_mx_mia', miguel: 'es_us_miguel', lupe: 'es_us_lupe', penelope: 'es_us_penelope',
      enrique: 'es_es_enrique', conchita: 'es_es_conchita', lucia: 'es_es_lucia',
      brian: 'en_brian', emma: 'en_emma', joey: 'en_joey', matthew: 'en_matthew'
    };

    function initTwitchChatIRC(targetChan, retries = 0) {
      if (!targetChan) return;
      if (window.tmi && window.tmi.Client) {
        try {
          console.log(`🟢 [TTS Overlay] Conectando a Twitch IRC #${targetChan}...`);
          const tmiClient = new window.tmi.Client({
            options: { debug: false },
            connection: { reconnect: true, secure: true },
            channels: [targetChan]
          });
          tmiClient.connect().then(() => {
            console.log(`✅ [TTS Overlay] Conectado exitosamente a Twitch IRC #${targetChan}`);
          }).catch(err => {
            console.warn(`⚠️ [TTS Overlay] Error conectando a Twitch IRC #${targetChan}:`, err);
          });

          tmiClient.on('message', (ch, tags, message, self) => {
            const username = tags['display-name'] || tags.username || 'Espectador';
            const trimmed = (message || '').trim();
            if (!trimmed) return;

            const firstWord = trimmed.split(' ')[0].toLowerCase();
            let matchedVoice = null;

            if (firstWord.startsWith('!')) {
              const cmdToken = firstWord.slice(1);
              if (cmdToken === 'tts') {
                matchedVoice = 'es_mx_mia';
              } else if (TTS_ALIAS_MAP[cmdToken]) {
                matchedVoice = TTS_ALIAS_MAP[cmdToken];
              }
            }

            if (matchedVoice) {
              const voiceText = trimmed.slice(firstWord.length).trim();
              if (voiceText) {
                console.log(`🎙️ [TTS Overlay] Comando TTS recibido de @${username} (#${ch}): '!${firstWord.slice(1)} ${voiceText}'`);
                const audioUrl = `/api/tts?text=${encodeURIComponent(voiceText)}&voice=${encodeURIComponent(matchedVoice)}`;
                const ttsData = {
                  id: 'tts_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                  user: username,
                  text: voiceText,
                  voice: matchedVoice,
                  audioUrl: audioUrl,
                  channel: ch
                };
                handleIncomingMessage({ event: 'tts', data: ttsData });
              }
            }
          });
        } catch(e) {
          console.error(`⚠️ [TTS Overlay] Error al inicializar tmi.js:`, e);
        }
      } else if (retries < 25) {
        setTimeout(() => initTwitchChatIRC(targetChan, retries + 1), 200);
      } else {
        console.warn(`⚠️ [TTS Overlay] window.tmi no estuvo disponible tras múltiples reintentos.`);
      }
    }

    function connectChannels() {
      if (myStreamerKey) {
        initTwitchChatIRC(myStreamerKey);
      }

      // 1. Local WebSocket con reconexión automática en segundo plano
      let wsInstance = null;
      let wsReconnectTimeout = null;

      function connectLocalWs(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        try {
          wsInstance = new WebSocket(url);
          wsInstance.onopen = () => {
            console.log(`🟢 [TTS Overlay] Conectado a Servidor WebSocket local (${url})`);
            if (myStreamerKey || myToken) {
              wsInstance.send(JSON.stringify({
                action: 'join',
                room: myStreamerKey || myToken,
                channel: myStreamerKey,
                token: myToken
              }));
            }
          };
          wsInstance.onmessage = (event) => {
            try { handleIncomingMessage(JSON.parse(event.data)); } catch(e) {}
          };
          wsInstance.onerror = (err) => {
            console.warn(`⚠️ [TTS Overlay] Error en WebSocket local:`, err);
            scheduleWsReconnect(url);
          };
          wsInstance.onclose = () => scheduleWsReconnect(url);
        } catch(e) {
          scheduleWsReconnect(url);
        }
      }

      function scheduleWsReconnect(url) {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        wsReconnectTimeout = setTimeout(() => {
          connectLocalWs(url);
        }, 3000);
      }

      const wsParams = [];
      if (myStreamerKey) wsParams.push(`channel=${encodeURIComponent(myStreamerKey)}`);
      if (myToken) wsParams.push(`token=${encodeURIComponent(myToken)}`);
      const wsQs = wsParams.length ? `?${wsParams.join('&')}` : '';

      const isGitHubPages = location.hostname.endsWith('github.io');
      const wsUrl = !isGitHubPages
        ? `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}${wsQs}`
        : 'ws://localhost:3000';

      connectLocalWs(wsUrl);

      // 2. Cloud Real-time Relay (Paho MQTT) con reconexión automática
      let mqttClient = null;
      let mqttReconnectTimeout = null;

      function connectMqtt() {
        if (typeof Paho === 'undefined') return;
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);

        const targetChan = myStreamerKey || channel;
        if (!targetChan) return;
        const clientId = 'orbi_tts_' + Math.random().toString(36).substring(2, 9);
        try {
          mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
          mqttClient.onConnectionLost = (responseObject) => {
            console.warn('⚠️ [TTS Overlay] Conexión MQTT perdida, reconectando...', responseObject);
            scheduleMqttReconnect();
          };
          mqttClient.onMessageArrived = (message) => {
            try {
              const payload = JSON.parse(message.payloadString);
              handleIncomingMessage(payload);
            } catch(e) {}
          };
          mqttClient.connect({
            useSSL: true,
            timeout: 6,
            keepAliveInterval: 30,
            onSuccess: () => {
              console.log(`🟢 [TTS Overlay] Conectado exitosamente a Relé MQTT de la Nube (Canal: ${targetChan})`);
              if (token) {
                mqttClient.subscribe(`orbibot/${targetChan}_${token}/events`);
              } else {
                mqttClient.subscribe(`orbibot/${targetChan}/events`);
              }
            },
            onFailure: (e) => {
              console.warn('⚠️ [TTS Overlay] Error al conectar a MQTT:', e);
              scheduleMqttReconnect();
            }
          });
        } catch(e) {
          scheduleMqttReconnect();
        }
      }

      function scheduleMqttReconnect() {
        if (mqttReconnectTimeout) clearTimeout(mqttReconnectTimeout);
        mqttReconnectTimeout = setTimeout(connectMqtt, 3500);
      }

      connectMqtt();

      // 3. BroadcastChannel & Storage aislados por streamer (sin mezclar cuentas)
      if (typeof BroadcastChannel !== 'undefined') {
        const channelsToListen = new Set(['orbibot_stream_channel', 'orbyxbot_stream_default']);
        if (myStreamerKey) channelsToListen.add('orbyxbot_stream_' + myStreamerKey);
        if (myToken) channelsToListen.add('orbyxbot_stream_' + myToken);

        channelsToListen.forEach(chanName => {
          try {
            const bc = new BroadcastChannel(chanName);
            bc.onmessage = (e) => handleIncomingMessage(e.data);
          } catch(e) {}
        });
      }

      window.addEventListener('storage', (e) => {
        if (!e.newValue) return;
        if (myStreamerKey && e.key === ('orbibot_last_event_' + myStreamerKey)) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        } else if (myToken && e.key === ('orbibot_last_event_' + myToken)) {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        } else if (e.key === 'orbibot_last_event') {
          try { handleIncomingMessage(JSON.parse(e.newValue)); } catch (err) {}
        }
      });

      // 4. OBS Scene Activate & Visibility Health Watcher
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (!wsInstance || wsInstance.readyState !== WebSocket.OPEN) {
            connectLocalWs(wsUrl);
          }
          if (!mqttClient || !mqttClient.isConnected()) {
            connectMqtt();
          }
        }
      });

      // 5. Chequeo periódico de salud en segundo plano cada 15s
      setInterval(() => {
        const wsOpen = wsInstance && wsInstance.readyState === WebSocket.OPEN;
        const mqttOpen = mqttClient && mqttClient.isConnected();
        if (!wsOpen && !mqttOpen) {
          connectLocalWs(wsUrl);
          connectMqtt();
        }
      }, 15000);
    }

    connectChannels();
  </script>
</body>
</html>
